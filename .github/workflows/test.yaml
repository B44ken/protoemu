name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install compilers and codec dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog clang zlib1g-dev tcpdump

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt -r demo/requirements.txt

      - name: Run tests
        run: |
          make programs test-c test-core
          make -C test
          python - <<'PY'
          import xml.etree.ElementTree as ET
          results = ET.parse('test/results.xml').getroot()
          assert results.findall('.//testcase')
          assert not results.findall('.//failure') and not results.findall('.//error')
          PY

      - name: Run independent ethernet peer demo
        run: python demo/run.py --output build/demo

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
            build/demo/result.json
            build/demo/results.xml
            build/demo/ethernet.pcap
            build/demo/tcpdump.txt
