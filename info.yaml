project:
  title:        "protoemu"
  author:       "B44ken"
  discord:      ""
  description:  "programmable protocol emulator (hello world: sram + uart)"
  language:     "Verilog"
  clock_hz:     60000000
  tiles:        "8x4"
  top_module:   "tt_um_protoemu"
  source_files:
    - "project.v"
    - "chip.v"
    - "sram_bb.v"

pinout:
  ui[0]: "host data 0"
  ui[1]: "host data 1"
  ui[2]: "host data 2"
  ui[3]: "host data 3"
  ui[4]: "host data 4"
  ui[5]: "host data 5"
  ui[6]: "host data 6"
  ui[7]: "host data 7"

  uo[0]: "sram data 0"
  uo[1]: "sram data 1"
  uo[2]: "sram data 2"
  uo[3]: "sram data 3"
  uo[4]: "sram data 4"
  uo[5]: "sram data 5"
  uo[6]: "sram data 6"
  uo[7]: "sram data 7"

  uio[0]: "uart tx"
  uio[1]: "busy"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: "host strobe"
  uio[7]: "host command/data"

yaml_version: 6
