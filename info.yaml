# Tiny Tapeout project information
project:
  title:        "protoemu"      # Project title
  author:       "B44ken"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "two c-described programmable protocol engines"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     60000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "fifo.v"
    - "engine.v"
    - "engine_wrap.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "host data 0"
  ui[1]: "host data 1"
  ui[2]: "host data 2"
  ui[3]: "host data 3"
  ui[4]: "host data 4"
  ui[5]: "host data 5"
  ui[6]: "host data 6"
  ui[7]: "host data 7"

  # Outputs
  uo[0]: "host read 0"
  uo[1]: "host read 1"
  uo[2]: "host read 2"
  uo[3]: "host read 3"
  uo[4]: "host read 4"
  uo[5]: "host read 5"
  uo[6]: "host read 6"
  uo[7]: "host read 7"

  # Bidirectional pins
  uio[0]: "protocol pin 0"
  uio[1]: "protocol pin 1"
  uio[2]: "protocol pin 2"
  uio[3]: "protocol pin 3"
  uio[4]: "protocol pin 4"
  uio[5]: "protocol pin 5 / host ready"
  uio[6]: "host strobe"
  uio[7]: "host command/data"

# Do not change!
yaml_version: 6
