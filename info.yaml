project:
  title:        "protoemu"
  author:       "B44ken"
  discord:      ""
  description:  "uart, spi and i2c controllers with sram fifos"
  language:     "Verilog"
  clock_hz:     60000000
  tiles:        "8x4"
  top_module:   "tt_um_protoemu"
  source_files:
    - "project.v"
    - "chip.v"
    - "sram_bb.v"

pinout:
  ui[0]: "host data 0"
  ui[1]: "host data 1"
  ui[2]: "host data 2"
  ui[3]: "host data 3"
  ui[4]: "host data 4"
  ui[5]: "host data 5"
  ui[6]: "host data 6"
  ui[7]: "host data 7"

  uo[0]: "register data 0"
  uo[1]: "register data 1"
  uo[2]: "register data 2"
  uo[3]: "register data 3"
  uo[4]: "register data 4"
  uo[5]: "register data 5"
  uo[6]: "register data 6"
  uo[7]: "register data 7"

  uio[0]: "uart tx / spi sck / i2c scl"
  uio[1]: "uart rx / spi mosi / i2c sda"
  uio[2]: "spi miso"
  uio[3]: "spi cs"
  uio[4]: ""
  uio[5]: "rx data available"
  uio[6]: "host strobe"
  uio[7]: "host command/data"

yaml_version: 6
